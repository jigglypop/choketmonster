<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preload" href="/fonts/ChoketSansVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/ui/loading-screen.css" />
    <meta name="theme-color" content="#173f39" />
    <meta name="description" content="버전별 포켓몬 수집과 개체별 기억, 실제 초파리 커넥톰 일부가 행동에 관여하는 포획·배틀·육성 모험" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="초켓몬스터" />
    <meta property="og:title" content="초켓몬스터 · 포켓몬 수집 모험" />
    <meta property="og:description" content="버전별로 포켓몬을 모으고, 나만의 파트너와 함께 모험하세요." />
    <meta property="og:url" content="__PUBLIC_SITE_URL__/" />
    <meta property="og:image" content="__PUBLIC_SITE_URL__/chocketmon.png?v=__SHARE_IMAGE_HASH__" />
    <meta property="og:image:secure_url" content="__PUBLIC_SITE_URL__/chocketmon.png?v=__SHARE_IMAGE_HASH__" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta property="og:image:alt" content="초켓몬스터 모험 대표 이미지" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="초켓몬스터 · 포켓몬 수집 모험" />
    <meta name="twitter:image" content="__PUBLIC_SITE_URL__/chocketmon.png?v=__SHARE_IMAGE_HASH__" />
    <meta name="twitter:image:alt" content="초켓몬스터 모험 대표 이미지" />
    <meta name="color-scheme" content="light" />
    <title>초켓몬스터 · 포켓몬 수집 모험</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/chocketmon.png?v=__SHARE_IMAGE_HASH__" />
  </head>
  <body>
    <section id="startup-loading" class="adventure-loading" aria-label="초켓몬스터 시작">
      <div class="adventure-loading__scene" aria-hidden="true">
        <img class="adventure-loading__art" src="/src/ui/art/title-1672.webp" srcset="/src/ui/art/title-960.webp 960w, /src/ui/art/title-1672.webp 1672w" sizes="(orientation: portrait) 190vw, 100vw" width="1672" height="941" fetchpriority="high" decoding="async" alt="" />
        <span class="adventure-loading__sparkles"></span>
      </div>
      <div class="adventure-loading__card">
        <div class="adventure-loading__body">
          <h1 class="adventure-loading__title">초켓몬스터</h1>
          <form id="startup-auth" class="startup-auth" novalidate>
            <div class="startup-auth__modes"><button type="button" data-auth-mode="login" aria-pressed="true" disabled>로그인</button><button type="button" data-auth-mode="register" aria-pressed="false" disabled>회원가입</button></div>
            <label>아이디<input name="username" autocomplete="username" maxlength="32" required /></label>
            <label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="128" required /></label>
            <label data-auth-confirm hidden>비밀번호 확인<input name="passwordConfirmation" type="password" autocomplete="new-password" maxlength="128" /></label>
            <p data-auth-error class="startup-auth__error" role="alert" hidden></p>
            <button type="submit" class="startup-auth__submit" disabled>로그인</button>
          </form>
          <div data-loading-stages hidden>
            <div class="adventure-loading__stage"><div class="adventure-loading__label"><strong>회로</strong><span data-loading-percent="connectome">0%</span></div><progress data-loading-bar="connectome" aria-label="회로 준비" max="100" value="0"></progress><p class="adventure-loading__detail" data-loading-detail="connectome"></p></div>
            <div class="adventure-loading__stage"><div class="adventure-loading__label"><strong>3D 월드</strong><span data-loading-percent="world">0%</span></div><progress data-loading-bar="world" aria-label="3D 월드 준비" max="100" value="0"></progress><p class="adventure-loading__detail" data-loading-detail="world"></p></div>
          </div>
          <p class="adventure-loading__status" data-loading-status role="status" aria-live="polite">로그인 확인 중</p>
          <button type="button" class="adventure-loading__retry" data-loading-retry hidden>다시 시도</button>
          <noscript>JavaScript를 켜 주세요.</noscript>
        </div>
      </div>
    </section>
    <div id="app"></div><script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
