name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      # Pins were verified against the official GitHub API; see infra/action-pins.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a stale main deployment
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [ "${main_sha}" != "${GITHUB_SHA}" ]; then
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale deployment: main=${main_sha}, workflow=${GITHUB_SHA}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify pinned actions
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib
          pins = json.loads(pathlib.Path('infra/action-pins.json').read_text())
          workflow = pathlib.Path('.github/workflows/deploy.yml').read_text()
          for name in ('actions/checkout', 'actions/setup-node', 'actions/upload-artifact', 'aws-actions/configure-aws-credentials'):
              expected = f"uses: {name}@{pins[name]['sha']}"
              if expected not in workflow:
                  raise SystemExit(f'unverified action pin: {name}')
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install and validate web application
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          python3 scripts/restore-source-cache.py
          npm exec vitest -- run --maxWorkers 2 --testTimeout 60000
          npm run build
          npx tsx scripts/prepare-deploy.ts

      - name: Detect Rust release changes
        if: steps.gate.outputs.run == 'true'
        id: rust
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Compare against the last published release: a failed prior push must
          # not cause the next push to skip a server binary that never deployed.
          deployed="$(python3 - <<'PY'
          import json, urllib.request
          try:
              req = urllib.request.Request('https://d3b0jo8g1tseoa.cloudfront.net/version.json', headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  print(json.load(response).get('gitCommit', ''))
          except Exception:
              print('')
          PY
          )"
          build=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || ! [[ "${deployed}" =~ ^[0-9a-f]{40}$ ]]; then
            build=true
          elif ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            build=true
          elif ! git diff --quiet "${deployed}" "${GITHUB_SHA}" -- rust-server src/data/trainer-battle-catalog.json; then
            build=true
          fi
          echo "build=${build}" >> "${GITHUB_OUTPUT}"

      - name: Build static Rust release
        if: steps.gate.outputs.run == 'true' && steps.rust.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path rust-server/Cargo.toml
          install -D -m 0755 rust-server/target/x86_64-unknown-linux-musl/release/choketmon-server artifacts/rust-release/choketmon-server

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        if: steps.gate.outputs.run == 'true'
        with:
          role-to-assume: arn:aws:iam::960243570517:role/choketmon-github-deploy
          aws-region: ap-northeast-2

      - name: Deploy server then static site
        if: steps.gate.outputs.run == 'true'
        run: |
          args=(--receipt artifacts/deploy-latest.json --commit "${GITHUB_SHA}")
          if [ "${{ steps.rust.outputs.build }}" = "true" ]; then
            args+=(--binary artifacts/rust-release/choketmon-server)
          fi
          python3 scripts/deploy-ci.py "${args[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: production-receipts-${{ github.sha }}
          path: |
            artifacts/ci-deploy-*/receipt.json
            artifacts/ci-deploy-*/*-command.json
            artifacts/ci-deploy-*/pending-*-ssm.json
          if-no-files-found: ignore
          retention-days: 30
