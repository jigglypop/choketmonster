AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront OAC hosting for Choketmonster.

Parameters:
  BucketName:
    Type: String
    Default: choketmonster-960243570517-apne2
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  WebAclArn:
    Type: String
    Default: ''
    Description: Optional us-east-1 CLOUDFRONT WebACL ARN used by a flat-rate plan.
  ApiVpcOriginId:
    Type: String
    Default: ''
  ApiPrivateDns:
    Type: String
    Default: ''

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, '']]
  HasApi: !Not [!Equals [!Ref ApiVpcOriginId, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRollbackVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: application
          Value: choketmonster

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: SigV4 access from the Choketmonster distribution only
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-html-short'
        Comment: Short cache for index, JSON and other mutable files
        DefaultTTL: 60
        MaxTTL: 300
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  HashedAssetCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-hashed-assets-long'
        Comment: One year immutable cache for Vite content-hashed assets
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite only extensionless browser routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var segment = uri.substring(uri.lastIndexOf('/') + 1);
          if (uri.endsWith('/') || segment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Choketmonster static web application
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # Flat-rate plans cover the global edge network and require the full
        # price class. Preserve the lower-cost regional class on pay-as-you-go.
        PriceClass: !If [HasWebAcl, PriceClass_All, PriceClass_100]
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Origins:
          - Id: private-s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - !If
            - HasApi
            - Id: rust-api-origin
              DomainName: !Ref ApiPrivateDns
              VpcOriginConfig:
                VpcOriginId: !Ref ApiVpcOriginId
                OriginReadTimeout: 30
                OriginKeepaliveTimeout: 5
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: private-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # UseOriginCacheControlHeaders forwards the viewer Host header and
          # breaks private S3 REST origins. CachingOptimized still honors the
          # origin Cache-Control header (with a one-second minimum TTL).
          CachePolicyId: !If [HasWebAcl, '658327ea-f89d-4fab-a63d-7e88639e58f6', !Ref HtmlCachePolicy]
          ResponseHeadersPolicyId: !If [HasWebAcl, '67f7725c-6f97-4210-82d7-5512b31e9d03', !Ref SecurityHeaders]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - !If
            - HasApi
            - PathPattern: api/*
              TargetOriginId: rust-api-origin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            - !Ref AWS::NoValue
          - PathPattern: assets/*
            TargetOriginId: private-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !If [HasWebAcl, '658327ea-f89d-4fab-a63d-7e88639e58f6', !Ref HashedAssetCachePolicy]
            ResponseHeadersPolicyId: !If [HasWebAcl, '67f7725c-6f97-4210-82d7-5512b31e9d03', !Ref SecurityHeaders]
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: application
          Value: choketmonster

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Description: Private deployment bucket
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref Distribution
  DistributionArn:
    Description: CloudFront distribution ARN
    Value: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  DistributionDomainName:
    Description: HTTPS application hostname
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Description: HTTPS application URL
    Value: !Sub 'https://${Distribution.DomainName}'
